<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyToHost - Cloud Control Plane</title>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-panel: #141722;
            --bg-input: #1d2234;
            --text-main: #f1f3f9;
            --text-muted: #7987a5;
            --accent-green: #00e676;
            --accent-blue: #2979ff;
            --accent-danger: #ff1744;
            --border-color: #262f4c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Top Navigation Header */
        .header { background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .back-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .back-btn:hover { background: var(--border-color); }

        /* Main Dynamic Area */
        .container { flex-grow: 1; padding: 15px; overflow-y: auto; padding-bottom: 80px; }
        .screen { display: none; flex-direction: column; gap: 15px; animation: fadeIn 0.2s ease-in-out; }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Cards and Components */
        .card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .card-title { font-size: 14px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }

        /* Buttons Setup */
        .btn { padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; color: #fff; }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-danger { background: var(--accent-danger); }
        .btn-blue { background: var(--accent-blue); }
        .btn-small { padding: 6px 12px; font-size: 12px; border-radius: 4px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 🖥️ Source Tree Layout (BIG Editor Screen) */
        .workspace-layout { display: flex; flex-direction: column; gap: 15px; height: calc(100vh - 210px); }
        .file-list { display: flex; flex-direction: column; gap: 8px; max-height: 120px; overflow-y: auto; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-input); padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; }
        .file-item.active { border-color: var(--accent-blue); background: #1c2b4a; }
        .editor-area { flex-grow: 1; position: relative; }
        #codeEditor { width: 100%; height: 100%; background: #07080c; border: 1px solid var(--border-color); border-radius: 8px; color: #5af78e; font-family: "Fira Code", Monaco, monospace; font-size: 14px; padding: 15px; outline: none; resize: none; line-height: 1.6; }

        /* Env Row Grid */
        .env-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .env-input { background: var(--bg-input); border: 1px solid var(--border-color); padding: 12px; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
        .env-key { width: 35%; }
        .env-val { flex-grow: 1; }

        /* Black Professional Console */
        .console { background: #000; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-family: "Courier New", Courier, monospace; height: 180px; overflow-y: auto; color: #5af78e; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }

        /* Bot List Selector Home */
        .bot-list-item { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .bot-info h4 { font-size: 15px; color: #fff; margin-bottom: 4px; }
        .bot-info p { font-size: 12px; color: var(--text-muted); }

        /* 📱 BOTTOM NAVIGATION FOOTER (হুবহু আপনার স্ক্রিনশটের মতো) */
        .footer-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .footer-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; gap: 4px; cursor: pointer; width: 33%; height: 100%; transition: 0.2s; }
        .footer-btn span.icon { font-size: 18px; }
        .footer-btn.active { color: var(--accent-blue); background: var(--bg-main); }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="topTitle">EasyToHost - Home Cluster</h1>
        <button class="back-btn" id="backToHomeBtn" onclick="loadHomeScreen()" style="display: none;">⬅️ Back to Home</button>
    </div>

    <div class="container">

        <div id="screen-home" class="screen active">
            <div id="botClusterContainer">
                <div class="bot-list-item" onclick="loadBotControlPlane('Nova_Bot')">
                    <div class="bot-info">
                        <h4>Nova bot Container <span style="background:#24242b; padding:2px 6px; border-radius:4px; font-size:10px;">PYTHON</span></h4>
                        <p>&lt;&gt; EasyToHost Server Node Ready</p>
                    </div>
                    <button class="btn btn-danger btn-small" onclick="deleteBotContainer(event)">🗑️ Delete</button>
                </div>
            </div>
            <button class="btn btn-green" onclick="createNewBotNode()" style="margin-top: 10px; background: #28a745; color: #fff;">➕ Create a New Bot</button>
        </div>

        <div id="screen-infra" class="screen">
            <div class="card">
                <div class="card-title">⚙️ Language Runtime Engine Architecture</div>
                <select style="background: var(--bg-input); color:#fff; border:1px solid var(--border-color); padding:12px; border-radius:8px; width:100%; font-size:14px; outline:none;">
                    <option>Python 3.11 Runtime (Standard POSIX Environment)</option>
                    <option>OpenJDK 17 Runtime (Java Environment Node)</option>
                </select>
            </div>

            <div class="card">
                <div class="card-title">🎛️ Container Resource Allocation</div>
                <div style="display: flex; gap: 12px; width: 100%;">
                    <button class="btn btn-green" style="flex: 1; background: #28a745; color:#fff;" onclick="triggerDeployment()">🟢 Trigger Deployment</button>
                    <button class="btn btn-danger" style="flex: 1;" onclick="terminateAllocation()">🔴 Terminate Allocation</button>
                </div>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 5px;" id="clusterStateText">State Cluster: <span style="color:#ffb300;">Awaiting...</span></div>
            </div>

            <div class="card">
                <div class="card-title">💻 Live Distributed Execution Logs</div>
                <div class="console" id="terminalConsole">> Node Offline. Establish tunnel connectivity to process stream...</div>
            </div>
        </div>

        <div id="screen-source" class="screen">
            <div class="workspace-layout">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button class="btn btn-blue btn-small" style="flex:1;" onclick="createNewFile()">➕ Initialize Workspace File</button>
                    <button class="btn btn-green btn-small" style="flex:1; background: #28a745; color:#fff;" onclick="saveWholeFolder()">💾 Commit Changes to Main Branch</button>
                </div>
                <div class="file-list" id="fileListContainer">
                    </div>
                <div class="editor-area">
                    <textarea id="codeEditor" spellcheck="false"></textarea>
                </div>
            </div>
        </div>

        <div id="screen-env" class="screen">
            <div style="display: flex; flex-direction: column; gap: 15px;" id="envFieldsContainer">
                </div>
            <button class="btn btn-blue" onclick="addNewEnvField('', '')" style="margin-top: 10px;">➕ Construct Environment Key</button>
            <button class="btn btn-green" onclick="saveWholeFolder()" style="background: #28a745; color:#fff;">💾 Apply Production Configuration</button>
        </div>

    </div>

    <div class="footer-nav" id="mainAppFooter" style="display: none;">
        <button class="footer-btn active" id="btn-tab-infra" onclick="switchTab('infra')">
            <span class="icon">🎛️</span><span>Infrastructure</span>
        </button>
        <button class="footer-btn" id="btn-tab-source" onclick="switchTab('source')">
            <span class="icon">📂</span><span>Source Code</span>
        </button>
        <button class="footer-btn" id="btn-tab-env" onclick="switchTab('env')">
            <span class="icon">⚙️</span><span>Config Env</span>
        </button>
    </div>

    <script>
        let virtualFiles = {
            "main.py": "import discord\nfrom discord.ext import commands\nimport os\n\n# Advanced Multi-Tenant Infrastructure Node Engine",
            "moderation.py": "# Hybrid Security Management Logic Module"
        };
        let currentActiveFile = "main.py";
        let envVariables = {};
        let activeBotId = "";

        function loadHomeScreen() {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-home').classList.add('active');
            document.getElementById('mainAppFooter').style.display = 'none';
            document.getElementById('backToHomeBtn').style.display = 'none';
            document.getElementById('topTitle').innerText = "EasyToHost - Home Cluster";
        }

        function loadBotControlPlane(botId) {
            activeBotId = botId;
            document.getElementById('mainAppFooter').style.display = 'flex';
            document.getElementById('backToHomeBtn').style.display = 'block';
            document.getElementById('topTitle').innerText = `EasyToHost - ${botId.toUpperCase()}`;
            switchTab('infra');
            renderFileTree();
        }

        function switchTab(target) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.footer-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`screen-${target}`).classList.add('active');
            document.getElementById(`btn-tab-${target}`).classList.add('active');
            
            if(target === 'source') {
                document.getElementById('codeEditor').value = virtualFiles[currentActiveFile] || "";
            }
        }

        function renderFileTree() {
            let html = "";
            for(let file in virtualFiles) {
                let activeClass = file === currentActiveFile ? 'active' : '';
                html += `<div class="file-item ${activeClass}" onclick="openFile('${file}')">
                            <span>📄 ${file}</span>
                            <span style="color:var(--accent-danger); font-weight:bold;" onclick="deleteFile('${file}', event)">🗑️</span>
                         </div>`;
            }
            document.getElementById('fileListContainer').innerHTML = html;
        }

        function openFile(file) {
            virtualFiles[currentActiveFile] = document.getElementById('codeEditor').value;
            currentActiveFile = file;
            renderFileTree();
            document.getElementById('codeEditor').value = virtualFiles[file] || "";
        }

        function createNewFile() {
            let name = prompt("Enter Workspace File Name (e.g. core.py, settings.json):");
            if(name) {
                virtualFiles[name] = "";
                currentActiveFile = name;
                renderFileTree();
                document.getElementById('codeEditor').value = "";
            }
        }

        function deleteFile(file, event) {
            event.stopPropagation();
            if(confirm(`Remove file ${file} permanently from tree allocation?`)) {
                delete virtualFiles[file];
                renderFileTree();
                document.getElementById('codeEditor').value = "";
            }
        }

        function addNewEnvField(key = '', val = '') {
            let container = document.getElementById('envFieldsContainer');
            let div = document.createElement('div');
            div.className = 'env-row';
            div.innerHTML = `
                <input type="text" class="env-input env-key" placeholder="AWS_KEY_ID" value="${key}">
                <input type="text" class="env-input env-val" placeholder="VALUE" value="${val}">
                <span style="cursor:pointer; font-size:18px; color:var(--accent-danger);" onclick="deleteEnvRow(this)">❌</span>
            `;
            container.appendChild(div);
        }

        function deleteEnvRow(element) {
            element.parentElement.remove();
        }

        function compileEnvVariables() {
            envVariables = {};
            document.querySelectorAll('.env-row').forEach(row => {
                let key = row.querySelector('.env-key').value.trim();
                let val = row.querySelector('.env-val').value.trim();
                if(key) envVariables[key] = val;
            });
        }

        function saveWholeFolder() {
            virtualFiles[currentActiveFile] = document.getElementById('codeEditor').value;
            compileEnvVariables();
            
            fetch('/api/save-folder', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bot_id: activeBotId, files: virtualFiles, env_vars: envVariables })
            })
            .then(res => res.json())
            .then(data => alert("💾 Global Deployment Assets Synced & Committed!"));
        }

        function triggerDeployment() {
            compileEnvVariables();
            let consoleLog = document.getElementById('terminalConsole');
            document.getElementById('clusterStateText').innerHTML = "State Cluster: <span style='color:var(--accent-green);'>Active / Running</span>";
            consoleLog.innerHTML = "🚀 [EasyToHost Cloud Pipeline v3.0 Live]\n> Allocating sandbox thread nodes...\n> Storage configuration synchronized.\n> Establishing automated SSM proxy tunnels securely...";
            
            fetch('/api/trigger-deploy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bot_id: activeBotId, env_vars: envVariables })
            })
            .then(res => res.json())
            .then(data => {
                consoleLog.innerHTML += `\n\n🟢 [AWS ENGINE SUCCESS]: ${data.message}`;
                consoleLog.scrollTop = consoleLog.scrollHeight;
            });
        }

        function terminateAllocation() {
            compileEnvVariables();
            let consoleLog = document.getElementById('terminalConsole');
            document.getElementById('clusterStateText').innerHTML = "State Cluster: <span style='color:var(--accent-danger);'>Terminated / Offline</span>";
            
            fetch('/api/terminate-alloc', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ env_vars: envVariables })
            })
            .then(res => res.json())
            .then(data => {
                consoleLog.innerHTML += `\n\n🔴 [AWS ENGINE SHUTDOWN]: ${data.message}`;
            });
        }

        // ডিফল্ট ফিল্ডস বুটস্ট্র্যাপ
        addNewEnvField('AWS_ACCESS_KEY_ID', '');
        addNewEnvField('AWS_SECRET_ACCESS_KEY', '');
        addNewEnvField('AWS_INSTANCE_ID', '');
    </script>
</body>
</html>
